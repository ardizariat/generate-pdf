name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - name: Check go.mod and go.sum
        if: runner.os == 'Linux'
        run: go mod tidy -diff
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Race
        if: runner.os == 'Linux'
        run: go test -race ./... -count=1
      - name: Build
        run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
