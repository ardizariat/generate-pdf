name: Bug report
description: Report a problem with pdfgen
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include enough detail to reproduce the issue.
  - type: input
    id: version
    attributes:
      label: pdfgen version
      description: Output of `pdfgen --version` or the release you downloaded.
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Go version
      placeholder: macOS 15, Go 1.26.10
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and configuration
      description: The exact command, flags, and manifest (if any) you used.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the error message and relevant log output.
    validations:
      required: true
