version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      # maroto v2.4.3 does not build with pdfcpu 0.16; revisit when maroto supports it
      - dependency-name: "github.com/pdfcpu/pdfcpu"
        versions: [">= 0.16.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
